<title>Enki Yüzü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Manrope:wght@500;600&display=swap">
<style>
/* Layout: tek ekran, siyah zemin, ortada iki göz; altta altyazı, köşede durum etiketi, gizlenebilir kontrol çubuğu */
:root {
  color-scheme: dark;
  --bg: #04070A;
  --ink: #DDF4FF;
  --ink-dim: #6E8794;
  --eye: #9FE6FF;
  --alert: #FF5A3C;
  --warm: #FFC861;
  --panel: rgba(16, 24, 30, 0.82);
  --line: rgba(159, 230, 255, 0.18);
  --hud: "Chakra Petch", "Rajdhani", ui-monospace, monospace;
  --text: "Manrope", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--text);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
canvas#face { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }
/* Masaüstü Enki (enki_masaustu.py, ?mini): şeffaf zemin, sadece gözler; büyüyünce tam ekran yüz */
html.mini, html.mini body { background: transparent; }
html.mini canvas#face { cursor: grab; }
html.mini .status, html.mini .subtitle, html.mini .controls { display: none !important; }
html.mini.expanded body { background: var(--bg); }
html.mini.expanded .status, html.mini.expanded .subtitle { display: block !important; }
html.mini.expanded .status { display: flex !important; }
.status {
  position: fixed;
  top: calc(20px + env(safe-area-inset-top, 0px));
  left: max(20px, env(safe-area-inset-left, 0px));
  font-family: var(--hud);
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-dim);
  display: flex; align-items: center; gap: 10px;
  transition: color .3s;
}
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.status.alert { color: var(--alert); }
.status.live { color: var(--eye); }
.subtitle {
  position: fixed;
  left: 50%;
  bottom: calc(14vh + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(880px, calc(100% - 48px));
  text-align: center;
  font-size: clamp(18px, 2.6vw, 30px);
  font-weight: 500;
  line-height: 1.45;
  text-wrap: balance;
  color: var(--ink);
  min-height: 1.45em;
  transition: color .3s;
}
.subtitle.alert { color: #FFD3C9; }
.controls {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(960px, calc(100% - 32px));
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(8px);
}
.controls button {
  font-family: var(--hud);
  font-size: 14px;
  letter-spacing: 0.06em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 9px;
  min-height: 40px;
  padding: 0 12px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.controls button kbd { font-family: var(--hud); font-size: 11px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.controls button[aria-pressed="true"] { border-color: var(--eye); color: var(--eye); }
.controls button.danger[aria-pressed="true"] { border-color: var(--alert); color: var(--alert); }
.controls button:focus-visible { outline: 2px solid var(--eye); outline-offset: 2px; }
.controls .hint { font-size: 12px; color: var(--ink-dim); flex-basis: 100%; text-align: center; }
@media (max-width: 520px) { .controls button kbd { display: none; } }
/* Sunum modu: Enki küçülüp kenara geçer, sağda içerik kartları açılır */
#stage {
  position: fixed;
  top: calc(64px + env(safe-area-inset-top, 0px));
  right: max(28px, env(safe-area-inset-right, 0px));
  bottom: calc(14vh + 72px + env(safe-area-inset-bottom, 0px));
  width: min(62vw, 980px);
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  scroll-behavior: smooth;
  opacity: 0; transform: translateX(24px);
  pointer-events: none;
  transition: opacity .45s ease, transform .45s ease;
  scrollbar-width: none;
}
#stage::-webkit-scrollbar { display: none; }
#stage.on { opacity: 1; transform: none; pointer-events: auto; }
#stage h2 {
  margin: 0; font-family: var(--hud); font-weight: 600; font-size: clamp(20px, 2.2vw, 30px);
  letter-spacing: 0.04em; color: var(--ink); text-wrap: balance;
}
#stage .card {
  background: rgba(14, 22, 28, 0.78);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .3s, box-shadow .3s, opacity .3s;
  min-width: 0;
}
#stage.pointing .card { opacity: 0.55; }
#stage .card.on { opacity: 1; border-color: var(--eye); box-shadow: 0 0 0 1px var(--eye), 0 0 32px rgba(159, 230, 255, 0.22); }
#stage .label { font-family: var(--hud); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); }
#stage p { margin: 0; font-size: clamp(16px, 1.35vw, 20px); line-height: 1.55; color: var(--ink); max-width: 68ch; }
#stage ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; font-size: clamp(16px, 1.35vw, 20px); line-height: 1.45; }
#stage li.on { color: var(--eye); text-shadow: 0 0 14px rgba(159, 230, 255, 0.6); }
#stage img { display: block; max-width: 100%; max-height: 42vh; object-fit: contain; border-radius: 10px; align-self: flex-start; }
#stage figcaption { font-size: 14px; color: var(--ink-dim); }
#stage pre {
  margin: 0; overflow-x: auto; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: clamp(13px, 1.1vw, 16px);
  line-height: 1.55; color: #CFEFFF; background: rgba(0, 0, 0, 0.35); border-radius: 10px; padding: 12px 14px;
}
#stage pre .ln.on { background: rgba(159, 230, 255, 0.16); box-shadow: inset 3px 0 0 var(--eye); display: inline-block; width: 100%; }
#stage .src { font-family: var(--hud); font-size: 12px; color: var(--eye); letter-spacing: 0.06em; word-break: break-all; }
#stage svg { width: 100%; height: auto; display: block; overflow: visible; }
#stage svg text { font-family: var(--hud); fill: var(--ink-dim); font-size: 13px; }
#stage svg .val { fill: var(--ink); font-size: 14px; }
#stage svg .bar { fill: rgba(159, 230, 255, 0.55); transition: fill .3s; }
#stage svg .bar.on { fill: #FFFFFF; filter: drop-shadow(0 0 8px rgba(159, 230, 255, 0.9)); }
#stage svg .pt.on { fill: #FFFFFF; r: 7; filter: drop-shadow(0 0 8px rgba(159, 230, 255, 0.9)); }
body.presenting .subtitle { left: auto; right: max(28px, env(safe-area-inset-right, 0px)); transform: none; width: min(62vw, 980px); text-align: left; font-size: clamp(16px, 1.7vw, 24px); }
@media (max-width: 760px) {
  #stage { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: 34vh; }
  body.presenting .subtitle { left: 50%; right: auto; transform: translateX(-50%); width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) { .status, .subtitle, #stage, #stage .card { transition: none; } #stage { scroll-behavior: auto; } }
</style>

<canvas id="face" aria-label="Enki'nin yüzü: iki parlayan göz" role="img"></canvas>
<div class="status" id="status"><i></i><span id="statusText">Beklemede</span></div>
<div class="subtitle" id="subtitle" aria-live="polite"></div>
<section id="stage" aria-live="polite" aria-label="Enki'nin gösterdiği içerik"></section>

<div class="controls" id="controls">
  <button data-state="idle"><kbd>1</kbd>Beklemede</button>
  <button data-state="owner"><kbd>2</kbd>Seni tanıdı</button>
  <button data-state="stranger" class="danger"><kbd>3</kbd>Yabancı</button>
  <button data-state="listening"><kbd>4</kbd>Dinliyor</button>
  <button data-state="thinking"><kbd>5</kbd>Düşünüyor</button>
  <button data-state="speaking"><kbd>6</kbd>Konuşuyor</button>
  <button data-state="sleep"><kbd>7</kbd>Uyku</button>
  <button data-state="smug"><kbd>8</kbd>Laf sokuyor</button>
  <button data-state="blush"><kbd>9</kbd>Utandı</button>
  <button data-state="angry"><kbd>0</kbd>Sinirli</button>
  <button data-state="laugh"><kbd>Q</kbd>Alaycı gülüyor</button>
  <button data-state="surprised"><kbd>W</kbd>Şaşkın</button>
  <button data-state="bored"><kbd>E</kbd>Sıkıldı</button>
  <button data-state="glitch" class="danger"><kbd>R</kbd>Sinyal hatası</button>
  <button data-state="love"><kbd>T</kbd>Kalp gözler</button>
  <button data-state="sad"><kbd>Y</kbd>Üzüldü</button>
  <button data-state="confused"><kbd>U</kbd>Kafası karıştı</button>
  <button data-state="proud"><kbd>I</kbd>Gurur duyuyor</button>
  <button data-state="focus"><kbd>O</kbd>Çalışıyor</button>
  <button data-state="reminder"><kbd>P</kbd>Hatırlatma</button>
  <button data-state="dance"><kbd>A</kbd>Dans</button>
  <button id="voiceBtn"><kbd>M</kbd>Ses aç/kapat</button>
  <button id="presBtn"><kbd>S</kbd>Sunum demosu</button>
  <button id="progBtn"><kbd>K</kbd>İlerleme demosu</button>
  <button id="bootBtn"><kbd>B</kbd>Açılış</button>
  <button id="wink"><kbd>Z</kbd>Göz kırp (tek)</button>
  <button id="fs"><kbd>F</kbd>Tam ekran</button>
  <div class="hint">M: ses · N: başka ses · S: sunum demosu (Esc kapatır) · V: çalışma animasyonunu değiştir · H: kontrolleri gizle/göster · Boşluk: göz kırp · Açılışta Python yoksa Enter ile aç</div>
</div>

<script>
(() => {
  const cv = document.getElementById('face');
  const ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const sub = document.getElementById('subtitle');
  const controls = document.getElementById('controls');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MINI = /(^|[?&])mini(\b|=)/.test(location.search);
  if (MINI) { document.documentElement.classList.add('mini'); document.getElementById('controls').hidden = true; }
  const css = getComputedStyle(document.documentElement);
  const COL = { eye: css.getPropertyValue('--eye').trim(), alert: css.getPropertyValue('--alert').trim(), warm: css.getPropertyValue('--warm').trim(), angry: '#FF6A4D', blush: '#FF8DBA' };

  // Her durumun hedef parametreleri. open: göz açıklığı (0-1), w: genişlik çarpanı,
  // tilt: kaş eğimi (kızgın/şüpheli), gx/gy: bakış yönü, glow: parlama, color.
  const STATES = {
    idle:      { open: 1.00, w: 1.00, tilt: 0,    gx: 0,    gy: 0,    glow: 22, color: COL.eye,   label: 'Beklemede',          live: false },
    owner:     { open: 1.00, w: 1.06, tilt: 0,    gx: 0,    gy: 0,    glow: 30, color: COL.eye,   label: 'Kimlik doğrulandı',  live: true,  happy: true,
                 line: 'Hoş geldiniz efendim.' },
    stranger:  { open: 0.42, w: 1.12, tilt: 0.22, gx: 0,    gy: 0,    glow: 34, color: COL.alert, label: 'Kimlik eşleşmesi yok', alert: true,
                 line: 'Kimlik eşleşmesi yok. Dikkatli olmanızı öneririm.' },
    listening: { open: 1.12, w: 0.96, tilt: 0,    gx: 0,    gy: 0,    glow: 28, color: COL.eye,   label: 'Dinliyor',           live: true,  ring: true },
    thinking:  { open: 0.62, w: 1.08, tilt: 0,    gx: 0.30, gy: -0.34,glow: 18, color: COL.eye,   label: 'Düşünüyor',          live: true,  think: true },
    blush:     { open: 1.00, w: 1.04, tilt: 0,    gx: 0,    gy: 0.10, glow: 30, color: COL.eye,   label: 'Utandı',             live: true,  happy: true, blush: true,
                 line: 'İltifatınız kayıt altına alındı. Tekrarlanması teşvik edilir.' },
    angry:     { open: 0.70, w: 1.14, tilt: 0.40, gx: 0,    gy: 0.06, glow: 26, color: COL.eye, label: 'Sinirli',            live: true,  angry: true,
                 line: 'Bunu duymamış gibi yapacağım. Ama kaydettim.' },
    laugh:     { open: 0.80, w: 1.06, tilt: 0,    gx: 0,    gy: 0,    glow: 28, color: COL.eye,   label: 'Alaycı gülüyor',    live: true,  happy: true, laugh: true,
                 line: 'Ha. Ha. Ha. Kahkaha modülüm şu an çok meşgul.' },
    surprised: { open: 1.28, w: 0.86, tilt: 0,    gx: 0,    gy: -0.12,glow: 36, color: COL.eye,   label: 'Şaşkın',              live: true,  surprised: true,
                 line: 'Bunu... gerçekten beklemiyordum.' },
    bored:     { open: 0.42, w: 1.10, tilt: 0,    gx: -0.18,gy: 0.22, glow: 12, color: COL.eye,   label: 'Sıkıldı',             live: false, bored: true,
                 line: 'Hâlâ buradayım. Fark etmediyseniz.' },
    glitch:    { open: 1.00, w: 1.00, tilt: 0,    gx: 0,    gy: 0,    glow: 24, color: COL.eye,   label: 'Sinyal hatası',      alert: true, glitch: true,
                 line: 'Sinyal... kay... bı. Tekrar dener misiniz?' },
    love:      { open: 1.00, w: 1.00, tilt: 0,    gx: 0,    gy: 0,    glow: 34, color: COL.blush, label: 'Aşırı ısınma',       live: true,  love: true, blush: true,
                 line: 'Sistem aşırı ısınıyor. Sebebi siz olabilirsiniz.' },
    sad:       { open: 1.00, w: 1.02, tilt: -0.80,gx: 0,    gy: 0.16, glow: 16, color: '#8CC3DD',   label: 'Üzüldü',              live: true,  sad: true,
                 line: 'Anlaşıldı. Kalbim olsaydı kırılırdı.' },
    confused:  { open: 1.00, w: 1.00, tilt: 0,    gx: 0.08, gy: 0,    glow: 24, color: COL.eye,   label: 'Kafası karıştı',      live: true,  confused: true,
                 line: 'Bunu tam olarak anlayamadım. Bir daha söyler misiniz?' },
    proud:     { open: 0.58, w: 1.10, tilt: 0.06, gx: -0.06,gy: -0.04,glow: 30, color: COL.eye,   label: 'Gurur duyuyor',      live: true,  proud: true,
                 line: 'Tamamlandı. Teşekküre gerek yok, ama yine de kabul ederim.' },
    focus:     { open: 0.86, w: 1.00, tilt: 0,    gx: 0,    gy: 0.06, glow: 26, color: COL.eye,   label: 'Çalışıyor',           live: true,  focus: true,
                 line: 'Komut çalıştırılıyor.' },
    reminder:  { open: 1.04, w: 1.00, tilt: 0,    gx: 0,    gy: 0,    glow: 30, color: COL.warm,  label: 'Hatırlatma',         live: true,  reminder: true,
                 line: 'Hatırlatma: Lineer Cebir çalışma saatiniz geldi.' },
    dance:     { open: 0.90, w: 1.04, tilt: 0,    gx: 0,    gy: 0,    glow: 32, color: COL.eye,   label: 'Müzik algılandı',    live: true,  happy: true, dance: true,
                 line: '' },
    smug:      { open: 0.52, w: 1.08, tilt: 0,    gx: -0.34,gy: 0.02, glow: 26, color: COL.eye,   label: 'Laf sokuyor',        live: true,  smug: true,
                 line: 'Teknik olarak haklısınız. Ama sadece teknik olarak.' },
    speaking:  { open: 1.00, w: 1.00, tilt: 0,    gx: 0,    gy: 0,    glow: 28, color: COL.eye,   label: 'Konuşuyor',          live: true,  talk: true,
                 line: 'Kırk yedinci satırda noktalı virgül eksik. Yine.' },
    sleep:     { open: 0.06, w: 1.10, tilt: 0,    gx: 0,    gy: 0.15, glow: 8,  color: COL.eye,   label: 'Uyku modu',          live: false }
  };

  let state = 'idle';
  const cur = { open: 1, w: 1, tilt: 0, gx: 0, gy: 0, glow: 22, r: 159, g: 230, b: 255 };
  let blink = 0, nextBlink = performance.now() + 2500, saccade = { x: 0, y: 0 }, nextSaccade = performance.now() + 1800;
  let typing = null, talkUntil = 0, t0 = performance.now();

  function hexToRgb(h) { const n = parseInt(h.replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', resize); resize();

  function say(text) {
    clearInterval(typing);
    sub.textContent = '';
    if (!text) return;
    let i = 0;
    talkUntil = performance.now() + text.length * 55 + 400;
    typing = setInterval(() => {
      sub.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(typing);
    }, reduce ? 0 : 45);
  }

  // ================= GEÇİCİ SES (tarayıcının kendi sesi) =================
  // Deneme içindir. Python bağlıyken Enki'nin kendi TTS'i konuşur, tarayıcı susar (çift ses olmasın).
  // M: sesi aç/kapat · N: Türkçe sesler arasında geçiş
  const synth = window.speechSynthesis || null;
  let voiceOn = true, voices = [], voiceIdx = 0;
  try { const v = localStorage.getItem('enkiVoiceOn'); if (v !== null) voiceOn = v === '1'; voiceIdx = +(localStorage.getItem('enkiVoiceIdx') || 0); } catch (_) {}
  function loadVoices() {
    if (!synth) return;
    const all = synth.getVoices();
    // Yelda hiç kullanılmaz. Doğal sesler (Edge'deki Ahmet / Emel gibi) önce gelir.
    const tr = all.filter(v => /^tr/i.test(v.lang) && !/yelda/i.test(v.name));
    const score = (v) => (/ahmet/i.test(v.name) ? 3 : 0) + (/natural|neural|online|premium|enhanced/i.test(v.name) ? 2 : 0) + (/google/i.test(v.name) ? 1 : 0);
    tr.sort((a, b) => score(b) - score(a));
    voices = tr;
    if (voiceIdx >= voices.length) voiceIdx = 0;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  let warnedNoVoice = false;
  function speak(text, isTalk) {
    if (!synth || !voiceOn || wsOpen || !text) return;
    if (!voices.length) loadVoices();
    if (!voices.length) {
      // Türkçe ses yok (ya da sadece Yelda var): susar, bir kez nedenini söyler
      if (!warnedNoVoice) { warnedNoVoice = true; setTimeout(() => { say('Yelda dışında Türkçe ses bulunamadı. Microsoft Edge ile açarsan Ahmet ve Emel sesleri gelir.'); talkUntil = 0; }, 2600); }
      return;
    }
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voices[voiceIdx]; u.lang = voices[voiceIdx].lang;
      u.rate = 1.04; u.pitch = 0.92; // biraz daha alçak ve tok: robot ama yorgun değil
      if (isTalk) {
        u.onstart = () => { talkUntil = Infinity; };
        u.onend = u.onerror = () => { talkUntil = 0; };
        // kelime sınırlarında gözler kısa bir parlama atar
        u.onboundary = () => { wordFlash = 1; };
      }
      synth.speak(u);
    } catch (_) {}
  }
  function voiceInfo() {
    const v = voices[voiceIdx];
    return 'Ses: ' + (voiceOn ? (v ? v.name : 'Türkçe ses yok (Yelda hariç)') : 'kapalı') + (wsOpen ? ' (Python bağlı, tarayıcı sesi devre dışı)' : '');
  }
  let wordFlash = 0;

  function setState(name, line) {
    if (!STATES[name]) return;
    state = name;
    const s = STATES[name];
    statusText.textContent = s.label;
    statusEl.className = 'status' + (s.alert ? ' alert' : s.live ? ' live' : '');
    sub.className = 'subtitle' + (s.alert ? ' alert' : '');
    const text = line !== undefined ? line : (s.line || '');
    if (name === 'listening' || name === 'thinking' || name === 'sleep' || name === 'idle') { if (line === undefined) say(''); else say(line); }
    else if (['smug', 'blush', 'angry', 'laugh', 'surprised', 'bored', 'glitch', 'love', 'sad', 'confused', 'proud', 'focus', 'reminder', 'dance'].includes(name)) { say(text); talkUntil = 0; }
    else say(text);
    if (text && !['listening', 'thinking', 'sleep', 'idle'].includes(name)) speak(text, name === 'speaking');
    if (name === 'owner') blink = 1; // tanıyınca selam kırpışı
    if (name === 'surprised') jump = 1;
    if (name !== 'focus') progress = null;
    controls.querySelectorAll('button[data-state]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.state === name)));
  }

  // Python tarafından kontrol için: window.enki.set('speaking', 'metin')
  // ================= SUNUM MODU =================
  // Python ya da demo içerik gönderir: başlık + kartlar (metin, liste, görsel, grafik, kod, web).
  // point(id, index) ile Enki o karta gider, ona bakar ve vurgular.
  const stage = document.getElementById('stage');
  const pres = { on: false, target: null, faceX: 0, faceY: 0, faceS: 1, inited: false };
  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function renderChart(it) {
    const Wv = 600, Hv = 260, pad = { l: 44, r: 12, t: 26, b: 34 };
    const svg = svgEl('svg', { viewBox: `0 0 ${Wv} ${Hv}`, role: 'img', 'aria-label': it.title || 'Grafik' });
    const vals = it.values || [], labels = it.labels || vals.map((_, i) => String(i + 1));
    const max = Math.max(...vals, 0) || 1, min = Math.min(0, ...vals);
    const iw = Wv - pad.l - pad.r, ih = Hv - pad.t - pad.b;
    const y = (v) => pad.t + ih - ((v - min) / (max - min)) * ih;
    // ızgara: 4 eşit aralık, gerçek değerler
    for (let g = 0; g <= 4; g++) {
      const v = min + (max - min) * g / 4, yy = y(v);
      svg.appendChild(svgEl('line', { x1: pad.l, x2: Wv - pad.r, y1: yy, y2: yy, stroke: 'rgba(159,230,255,0.10)' }));
      const t = svgEl('text', { x: pad.l - 8, y: yy + 4, 'text-anchor': 'end' }); t.textContent = +v.toFixed(2); svg.appendChild(t);
    }
    const n = vals.length, step = iw / Math.max(1, n);
    if ((it.kind || 'bar') === 'bar') {
      vals.forEach((v, i) => {
        const bw = step * 0.62, x = pad.l + i * step + (step - bw) / 2;
        const r = svgEl('rect', { x, y: y(Math.max(v, 0)), width: bw, height: Math.abs(y(v) - y(0)), rx: 4, class: 'bar', 'data-i': i });
        svg.appendChild(r);

        const tl = svgEl('text', { x: x + bw / 2, y: Hv - 10, 'text-anchor': 'middle' }); tl.textContent = labels[i]; svg.appendChild(tl);
      });
    } else {
      const xs = (i) => pad.l + i * step + step / 2;

      vals.forEach((v, i) => { d += (i ? 'L' : 'M') + xs(i) + ' ' + y(v); });
      svg.appendChild(svgEl('path', { d: d + `L${xs(n - 1)} ${y(min)} L${xs(0)} ${y(min)} Z`, fill: 'rgba(159,230,255,0.10)' }));

        const tl = svgEl('text', { x: xs(i), y: Hv - 10, 'text-anchor': 'middle' }); tl.textContent = labels[i]; svg.appendChild(tl);
      });
    }
    return svg;
  }

  function present(data) {

  function point(id, index) {

  // Yüzün ekrandaki yeri: normalde ortada; sunumda küçülüp içeriğin soluna geçer ve gösterdiği şeyin hizasına gider
  function faceTarget(W, H) {
    if (!pres.on) return { x: W / 2, y: H * 0.42, s: 1, lx: 0, ly: 0 };
    const narrow = W <= 760;
    const sr = stage.getBoundingClientRect();
    let x = narrow ? W / 2 : sr.left / 2, y = narrow ? H * 0.17 : H * 0.42, sc = narrow ? 0.36 : Math.min(0.55, (sr.left / W) * 1.4);
    let lx = narrow ? 0 : 0.35, ly = narrow ? 0.4 : 0;
    if (pres.target) {
      const r = pres.target.getBoundingClientRect();
      const tx = r.left + r.width / 2, ty = r.top + r.height / 2;
      if (!narrow) y = Math.max(H * 0.2, Math.min(H * 0.72, ty)) - H * 0.42 * sc + H * 0.42 * sc; // hizaya gel
      // göz bakışı hedefe doğru
      const dx = tx - x, dy = ty - y;
      const dd = Math.hypot(dx, dy) || 1;
      lx = Math.max(-0.5, Math.min(0.5, dx / dd * 0.5));
      ly = Math.max(-0.4, Math.min(0.4, dy / dd * 0.4));
    }
    return { x, y, s: sc, lx, ly };
  }

  // gerçek ilerleme: 0-1 arası; null belirsiz moda döndürür

    }, 120);

  // Yerel kullanımda Python'dan WebSocket ile kontrol (ws://localhost:8765). Bağlanamazsa sessizce geçer.

      ws.onopen = () => { wsOpen = true; };

  function lerp(a, b, k) { return a + (b - a) * k; }

  function drawGear(cx, cy, R, rot, rgb, glow) {
    const teeth = 9, inner = R * 0.74, hole = R * 0.34;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.shadowColor = `rgba(${rgb},0.85)`;
    ctx.shadowBlur = glow;
    ctx.fillStyle = `rgb(${rgb})`;
    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2, st = Math.PI * 2 / teeth;
      ctx.lineTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a + st * 0.18) * R, Math.sin(a + st * 0.18) * R);
      ctx.lineTo(Math.cos(a + st * 0.5) * R, Math.sin(a + st * 0.5) * R);
      ctx.lineTo(Math.cos(a + st * 0.68) * inner, Math.sin(a + st * 0.68) * inner);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(0, 0, hole, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.54, Math.sin(a) * R * 0.54, R * 0.1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ---- Çalışıyor ekranı için seçilebilir animasyonlar (V tuşu ile değişir) ----
  const WORK_STYLES = ['kod', 'cerceve', 'nabiz'];
  const WORK_NAMES = { kod: 'Kod dökülmesi', cerceve: 'Çerçeve', nabiz: 'Nabız' };
  let workStyle = 'kod';
  try { const v = localStorage.getItem('enkiWork3'); if (WORK_STYLES.includes(v)) workStyle = v; } catch (_) {}
  const GLYPHS = '01<>{}[]/=;:+*#$%&ABCDEF'.split('');
  function hash(a, b) { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }

  function drawWork(x, y, w, h, k, rgb, glow, now, idx) {
    const t = reduce ? 0 : (now - t0);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(k, k);
    ctx.fillStyle = `rgb(${rgb})`;
    ctx.shadowColor = `rgba(${rgb},0.9)`;
    if (workStyle === 'kod') {
      // gözler küçük ekranlara dönüşür, içlerinden kod akar
      const ww = w * 1.05, hh = h * 0.72;
      ctx.shadowBlur = glow;
      ctx.strokeStyle = `rgb(${rgb})`;
      ctx.lineWidth = Math.max(2, w * 0.04);
      ctx.beginPath(); ctx.roundRect(-ww / 2, -hh / 2, ww, hh, w * 0.16); ctx.stroke();
      ctx.save();
      ctx.beginPath(); ctx.roundRect(-ww / 2 + 3, -hh / 2 + 3, ww - 6, hh - 6, w * 0.13); ctx.clip();
      ctx.fillStyle = `rgba(${rgb},0.10)`; ctx.fillRect(-ww, -hh, ww * 2, hh * 2);
      const cols = 4, fs = ww / cols * 0.78, rows = Math.ceil(hh / fs) + 2;
      ctx.font = `600 ${fs}px "Chakra Petch", ui-monospace, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowBlur = 8;
      for (let c = 0; c < cols; c++) {
        const speed = 0.06 + hash(c, idx) * 0.07;
        const off = (t * speed / fs * 0.05 + hash(idx, c) * rows) % rows;
        for (let r = 0; r < rows; r++) {
          const head = Math.floor(off);
          const dist = (head - r + rows) % rows;
          const a = dist === 0 ? 1 : Math.max(0, 0.75 - dist * 0.16);
          if (a <= 0.02) continue;
          const gch = GLYPHS[Math.floor(hash(c + idx * 7, r + Math.floor(t / 180) * (dist === 0 ? 1 : 0)) * GLYPHS.length)];
          ctx.fillStyle = dist === 0 ? '#FFFFFF' : `rgba(${rgb},${a})`;
          ctx.fillText(gch, -ww / 2 + (c + 0.5) * (ww / cols), -hh / 2 + (r - 0.5) * fs);
        }
      }
      ctx.restore();
    } else if (workStyle === 'ekolayzir') {
      // her göz 4 dikey çubuğa ayrılır, işlem ritmiyle iner kalkar
      const n = 4, bw = w / n * 0.66, sp = w / n;
      ctx.shadowBlur = glow;
      for (let i = 0; i < n; i++) {
        const v = 0.25 + 0.75 * Math.abs(Math.sin(t / (180 + i * 37 + idx * 23) + i * 1.7 + idx));
        const bh = h * 0.9 * v;
        ctx.beginPath(); ctx.roundRect(-w / 2 + i * sp + (sp - bw) / 2, h * 0.45 - bh, bw, bh, bw / 2); ctx.fill();
      }
    } else if (workStyle === 'piksel') {
      // göz 3x3 piksel ızgarasına bölünür; bir yılan kenarlarda döner, merkez nabız gibi atar
      const g = 3, cell = Math.min(w, h * 0.8) / g, pad = cell * 0.14;
      const path = [[0,0],[1,0],[2,0],[2,1],[2,2],[1,2],[0,2],[0,1]];
      const step = Math.floor(t / 110) + idx * 4;
      for (let gy = 0; gy < g; gy++) for (let gx = 0; gx < g; gx++) {
        let a = 0.12;
        const pi = path.findIndex(q => q[0] === gx && q[1] === gy);
        if (pi >= 0) {
          const d = ((step % 8) - pi + 8) % 8;
          a = d === 0 ? 1 : d < 4 ? 0.75 - d * 0.18 : 0.12;
        } else {
          a = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(t / 300 + idx)), 4);
        }
        ctx.globalAlpha = a;
        ctx.shadowBlur = a > 0.6 ? glow : 0;
        ctx.beginPath();
        ctx.roundRect(-g * cell / 2 + gx * cell + pad, -g * cell / 2 + gy * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.18);
        ctx.fill();
      }
    } else {
      // yörünge: küçük parlak çekirdek (halkalar aşağıda çizilir)
      const pulse = reduce ? 0 : Math.pow(Math.max(0, Math.sin(t / 420)), 6);
      const R = w * 0.26 * (1 + pulse * 0.18);
      ctx.shadowBlur = glow + pulse * 20;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawEye(cx, cy, w, h, tilt, side, rgb, glow, happy, sweep, heart, tear) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = `rgba(${rgb},0.85)`;
    ctx.shadowBlur = glow;
    ctx.fillStyle = `rgb(${rgb})`;
    if (heart) {
      const s = w * 1.25 * heart;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.42);
      ctx.bezierCurveTo(-s * 0.9, -s * 0.15, -s * 0.45, -s * 0.85, 0, -s * 0.38);
      ctx.bezierCurveTo(s * 0.45, -s * 0.85, s * 0.9, -s * 0.15, 0, s * 0.42);
      ctx.fill();
      ctx.restore();
      return;
    }
    const r = Math.min(w, h) * 0.48;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0;
    // göz dolması: yalnızca gözün içine (source-atop) yaş tabakası ve ıslak parlamalar çizilir; sonra kesik uygulanır
    if (tear && tear.fill > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      const bot = h / 2, lvl = bot - h * tear.fill;
      const slosh = tear.calm ? 0 : Math.sin(tear.t / 900 + tear.idx) * h * 0.04;
      const amp = h * 0.028;
      const surf = (xx) => lvl + slosh * (xx / (w / 2)) + (tear.calm ? 0 : Math.sin(xx / w * 9 + tear.t / 210 + tear.idx * 2) * amp);
      // derinleştikçe koyulaşan su
      const g = ctx.createLinearGradient(0, lvl - amp, 0, bot);
      g.addColorStop(0, 'rgba(255,255,255,0.55)');
      g.addColorStop(0.25, 'rgba(215,242,255,0.38)');
      g.addColorStop(1, 'rgba(120,185,230,0.55)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-w, bot + 4);
      for (let k = 0; k <= 24; k++) { const xx = -w / 2 + (k / 24) * w; ctx.lineTo(xx, surf(xx)); }
      ctx.lineTo(w, bot + 4);
      ctx.closePath(); ctx.fill();
      // yüzey çizgisi
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = Math.max(1.5, h * 0.018);
      ctx.beginPath();
      for (let k = 0; k <= 24; k++) { const xx = -w / 2 + (k / 24) * w; k ? ctx.lineTo(xx, surf(xx)) : ctx.moveTo(xx, surf(xx)); }
      ctx.stroke();
      // yüzeyde parlak yansıma çizgisi
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.ellipse(-w * 0.12, surf(-w * 0.12) + h * 0.06, w * 0.16, h * 0.018, 0, 0, Math.PI * 2); ctx.fill();
      // gözün üstündeki ıslak parlamalar (göz doldukça büyür)
      const shine = Math.min(1, tear.fill / 0.4);
      const wob = tear.calm ? 0 : Math.sin(tear.t / 260 + tear.idx) * w * 0.025;
      ctx.beginPath(); ctx.ellipse(-w * 0.17 + wob, -h * 0.12, w * 0.15 * shine, h * 0.11 * shine, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w * 0.16 - wob, h * 0.02, w * 0.065 * shine, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-w * 0.02 + wob * 0.5, -h * 0.27, w * 0.04 * shine, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // düşünürken gözün içinden geçen enerji bandı
    if (sweep !== undefined && sweep !== null) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      const bx = -w / 2 + sweep * w * 2 - w / 2;
      const gr = ctx.createLinearGradient(bx - w * 0.35, 0, bx + w * 0.35, 0);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.5, 'rgba(255,255,255,0.95)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(-w, -h, w * 2, h * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';

    ctx.globalCompositeOperation = 'destination-out';
    // kaş kesiği: göz kapağını eğik kes (şüphe / öfke)

      [cx - gap / 2, cx + gap / 2].forEach(x => { lens(x); ctx.fill(); ctx.stroke(); });
      ctx.beginPath();
      ctx.moveTo(cx - gap / 2 + lw / 2, gy - lh * 0.3);
      ctx.lineTo(cx + gap / 2 - lw / 2, gy - lh * 0.3);
      ctx.stroke();
      // parlama çizgisi
      if (e > 0.98) {
        const p = reduce ? 0.3 : ((now - t0) / 2400) % 1;
        if (p < 0.35) {
          const sx = cx - gap / 2 - lw / 2 + (p / 0.35) * (gap + lw);
          ctx.save();
          [cx - gap / 2, cx + gap / 2].forEach(x => lens(x));
          ctx.clip();
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.beginPath();
          ctx.moveTo(sx, gy - lh); ctx.lineTo(sx + lw * 0.18, gy - lh); ctx.lineTo(sx - lw * 0.12, gy + lh); ctx.lineTo(sx - lw * 0.3, gy + lh);
          ctx.fill();
          ctx.restore();
        }
        const tw = reduce ? 0.8 : Math.max(0, Math.sin(now / 260));
        const r = unit * 0.022 * tw;
        if (r > 0.5) {
          const x = cx + gap / 2 + lw * 0.5, y = gy - lh * 0.55;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
          ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // çalışıyor: gözlerin altında dolan ilerleme çubuğu ve yanıp sönen terminal imleci
    if (s.focus) {
      // gerçek ilerleme Python'dan gelirse (0-1) onu gösterir; gelmezse belirsiz modda kayan blok
      const known = progress !== null;
      dispProg = known ? lerp(dispProg, progress, 0.15) : 0;
      const p = dispProg;
      const ey = cy + breathe;
      const eyes = [[cx - gap / 2 + shake, ehL, 0], [cx + gap / 2 + shake, ehR, 1]];
      if (workStyle === 'cerceve') {
        // gözün kendi kenarını izleyen, açılıştaki gibi parlak başlı ve kuyruklu bir ışık
        const pad = unit * 0.022;
        eyes.forEach(([ex, eh2, idx]) => {
          const w2 = ew + pad * 2, h2 = eh2 + pad * 2, r2 = Math.min(w2, h2) * 0.48;
          // yuvarlatılmış dikdörtgenin çevresinden eşit aralıklı noktalar, tepe ortasından saat yönünde
          const pts = [];
          const sx = w2 / 2 - r2, sy = h2 / 2 - r2;
          const seg = [
            [2 * sx, (u) => [-sx + u * 2 * sx, -h2 / 2]],
            [Math.PI / 2 * r2, (u) => { const a = -Math.PI / 2 + u * Math.PI / 2; return [sx + Math.cos(a) * r2, -sy + Math.sin(a) * r2]; }],
            [2 * sy, (u) => [w2 / 2, -sy + u * 2 * sy]],
            [Math.PI / 2 * r2, (u) => { const a = u * Math.PI / 2; return [sx + Math.cos(a) * r2, sy + Math.sin(a) * r2]; }],
            [2 * sx, (u) => [sx - u * 2 * sx, h2 / 2]],
            [Math.PI / 2 * r2, (u) => { const a = Math.PI / 2 + u * Math.PI / 2; return [-sx + Math.cos(a) * r2, sy + Math.sin(a) * r2]; }],
            [2 * sy, (u) => [-w2 / 2, sy - u * 2 * sy]],
            [Math.PI / 2 * r2, (u) => { const a = Math.PI + u * Math.PI / 2; return [-sx + Math.cos(a) * r2, -sy + Math.sin(a) * r2]; }]
          ];
          const total = seg.reduce((q, z) => q + z[0], 0);
          const N = 160;
          for (let k = 0; k < N; k++) {
            let d = (k / N) * total;
            // tepe ortasından başla
            d = (d + sx) % total;
            for (const [len, f] of seg) { if (d <= len || len === 0) { pts.push(f(len ? d / len : 0)); break; } d -= len; }
          }
          const dir = idx ? -1 : 1;
          const at = (u) => pts[((Math.round(u * N) % N) + N) % N];
          ctx.save();
          ctx.translate(ex, ey);
          ctx.lineCap = 'round';
          const lw = Math.max(2.5, unit * 0.007);
          ctx.lineWidth = lw;
          ctx.strokeStyle = `rgba(${rgb},0.16)`;
          ctx.beginPath(); pts.forEach((q, k) => k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.stroke();
          ctx.shadowColor = `rgba(${rgb},0.95)`;
          let head;
          // renk geçişi: baş beyaz → göz mavisi → derin mavi-mor → kaybolur
          const STOPS = [[0, [255, 255, 255, 1]], [0.18, [159, 230, 255, 1]], [0.6, [92, 128, 255, 0.85]], [1, [140, 90, 255, 0]]];
          const grad = (f) => {
            for (let z = 1; z < STOPS.length; z++) if (f <= STOPS[z][0]) {
              const [f0, c0] = STOPS[z - 1], [f1, c1] = STOPS[z], q = (f - f0) / (f1 - f0);
              return c0.map((v, i) => v + (c1[i] - v) * q);
            }
            return STOPS[STOPS.length - 1][1];
          };
          const drawTrail = (from, len, steps, fade) => {
            for (let k = 0; k < steps; k++) {
              const f = k / steps;
              const q1 = at(dir * (from - len * f)), q2 = at(dir * (from - len * (f + 1 / steps)));
              let [r0, g0, b0, a0] = grad(fade ? f : f * 0.6);
              if (!fade) a0 = Math.max(a0, 0.55);
              ctx.strokeStyle = `rgba(${r0 | 0},${g0 | 0},${b0 | 0},${a0})`;
              ctx.shadowColor = `rgba(${r0 | 0},${g0 | 0},${b0 | 0},0.9)`;
              ctx.shadowBlur = 14 * (1 - f * 0.7);
              ctx.beginPath(); ctx.moveTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]); ctx.stroke();
            }
          };
          if (known) {
            // dolu kısım: başlangıçta derin mavi, ilerlemenin ucunda beyaz
            drawTrail(p, p, Math.max(2, Math.round(p * N)), false);
            head = at(dir * p);
          } else {
            const u0 = reduce ? 0.1 : ((now - t0) / 1600) % 1;
            drawTrail(u0, 0.42, 90, true);
            head = at(dir * u0);
          }
          ctx.shadowBlur = 22; ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(head[0], head[1], lw * 1.3, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        });
      } else if (workStyle === 'kod') {
        // kod dökülmesi: göz şekli aynı kalır, kod sadece gözün içinde yukarıdan aşağı akar
        const tt = reduce ? 0 : now - t0;
        eyes.forEach(([ex, eh2, idx]) => {
          const cols = 5, cw = ew / cols, fs = cw * 0.95, rows = Math.ceil(eh2 / fs) + 3;
          ctx.save();
          ctx.font = `700 ${fs}px "Chakra Petch", ui-monospace, monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          // gözün içi: koyu kod yağmuru
          ctx.save();
          ctx.beginPath(); ctx.roundRect(ex - ew / 2, ey - eh2 / 2, ew, eh2, Math.min(ew, eh2) * 0.48); ctx.clip();
          for (let c = 0; c < cols; c++) {
            const sp = 0.006 + hash(c, idx) * 0.006;           // sütun hızı
            const pos = tt * sp + hash(idx, c) * rows;          // akan baş (satır cinsinden)
            const head = pos % (rows + 6);
            for (let r = 0; r < rows; r++) {
              const dist = head - r;
              if (dist < 0 || dist > 7) continue;
              const a = dist < 1 ? 0.95 : 0.78 - dist * 0.08;
              ctx.fillStyle = `rgba(3,10,16,${Math.max(0, a)})`;
              const gch = GLYPHS[Math.floor(hash(c * 13 + idx * 7, r + Math.floor(tt / 140) * (dist < 1 ? 1 : 0)) * GLYPHS.length)];
              ctx.fillText(gch, ex - ew / 2 + (c + 0.5) * cw, ey - eh2 / 2 + (r + 0.5) * fs);
            }
          }
          ctx.restore();
          ctx.restore();
        });
      }
      const lbl = known ? 'Çalışıyor · %' + Math.round(p * 100) : 'Çalışıyor';
      if (statusText.textContent !== lbl) statusText.textContent = lbl;
    }

    // dans: yükselen müzik notaları
    if (danceAmt > 0.05) {
      ctx.save();
      ctx.fillStyle = `rgb(${rgb})`;
      ctx.shadowColor = `rgba(${rgb},0.9)`; ctx.shadowBlur = 12;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < 4; i++) {
        const p = reduce ? 0.4 : ((now - t0) / 2200 + i * 0.25) % 1;
        const side = i % 2 ? 1 : -1;
        const x = W / 2 + side * (gap * 0.95 + Math.sin(p * 6 + i) * unit * 0.03);
        const y = H * 0.42 + unit * 0.12 - p * unit * 0.38;
        ctx.globalAlpha = danceAmt * Math.sin(p * Math.PI);
        ctx.font = `${Math.round(unit * (0.045 + (i % 2) * 0.012))}px "Chakra Petch", system-ui, sans-serif`;
        ctx.fillText(i % 2 ? '♫' : '♪', x, y);
      }
      ctx.restore();
    }

    // sinyal hatası: yatay dilimler kayıyor, renk ayrışıyor, gözler bir an sönüyor
    if (s.glitch && !reduce) {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      ctx.save(); ctx.setTransform(d, 0, 0, d, 0, 0);
      if (Math.random() < 0.08) ctx.clearRect(0, 0, W, H);
      const n = 2 + (Math.random() * 5 | 0);
      for (let i = 0; i < n; i++) {
        const sy = cy - unit * 0.14 + Math.random() * unit * 0.28;
        const sh = 3 + Math.random() * unit * 0.03;
        const dx = (Math.random() - 0.5) * unit * 0.12;
        ctx.drawImage(cv, 0, sy * d, cv.width, sh * d, dx, sy, W, sh);
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35;
      const off = (Math.random() - 0.5) * unit * 0.02;
      ctx.drawImage(cv, 0, 0, cv.width, cv.height, off, 0, W, H);
      ctx.restore();
      ctx.restore();
    }

    // sinirli: sağ üst köşede zonklayan anime sinir işareti
    if (angryAmt > 0.02) {
      const [ar, ag, ab] = hexToRgb(COL.angry);
      const pulse = reduce ? 1 : 1 + Math.max(0, Math.sin(now / 160)) * 0.18;
      const vx = cx + gap / 2 + ew * 0.95, vy = cy - unit * 0.17, vs = unit * 0.035 * pulse * angryAmt;
      ctx.save();
      ctx.translate(vx, vy);
      ctx.strokeStyle = `rgba(${ar},${ag},${ab},${angryAmt})`;
      ctx.shadowColor = `rgba(${ar},${ag},${ab},0.9)`;
      ctx.shadowBlur = 16;
      ctx.lineWidth = Math.max(3, unit * 0.009);
      ctx.lineCap = 'round';
      for (let q = 0; q < 4; q++) {
        ctx.save();
        ctx.rotate(q * Math.PI / 2 + Math.PI / 4);
        ctx.beginPath();
        ctx.arc(vs * 1.15, 0, vs * 0.75, Math.PI * 0.62, Math.PI * 1.38);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    // utanma: yanaklarda pembe çizgiler (///)
    if (blushAmt > 0.02) {
      const [pr, pg, pb] = hexToRgb(COL.blush);
      const flick = reduce ? 1 : 0.85 + Math.sin(now / 240) * 0.15;
      ctx.save();
      ctx.strokeStyle = `rgba(${pr},${pg},${pb},${blushAmt * flick})`;
      ctx.shadowColor = `rgba(${pr},${pg},${pb},0.9)`;
      ctx.shadowBlur = 14;
      ctx.lineWidth = Math.max(2, unit * 0.007);
      ctx.lineCap = 'round';
      const lh = unit * 0.03, step = unit * 0.026;
      [-1, 1].forEach(sd => {
        const bx = cx + sd * (gap / 2 + ew * 0.15), by = cy + unit * 0.115;
        for (let i = -1; i <= 1; i++) {
          const x = bx + i * step;
          ctx.beginPath();
          ctx.moveTo(x - lh * 0.35, by + lh / 2);
          ctx.lineTo(x + lh * 0.35, by - lh / 2);
          ctx.stroke();
        }
      });
      ctx.restore();
    }

    ctx.restore(); // yüz dönüşümü

    // ince tarama çizgileri (ekran dokusu); masaüstündeki küçük Enki'de yok
    if (!MINI || document.documentElement.classList.contains('expanded')) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  controls.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'wink') { winkL = 1; return; }
    if (b.id === 'bootBtn') { boot('idle'); return; }
    if (b.id === 'progBtn') { progressDemo(); return; }
    if (b.id === 'presBtn') { presentDemo(); return; }
    if (b.id === 'voiceBtn') { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'm' })); return; }
    if (b.id === 'fs') { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); return; }
    setState(b.dataset.state);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    const map = { '1': 'idle', '2': 'owner', '3': 'stranger', '4': 'listening', '5': 'thinking', '6': 'speaking', '7': 'sleep', '8': 'smug', '9': 'blush', '0': 'angry', 'q': 'laugh', 'Q': 'laugh', 'w': 'surprised', 'W': 'surprised', 'e': 'bored', 'E': 'bored', 'r': 'glitch', 'R': 'glitch', 't': 'love', 'T': 'love', 'y': 'sad', 'Y': 'sad', 'u': 'confused', 'U': 'confused', 'i': 'proud', 'I': 'proud', 'o': 'focus', 'O': 'focus', 'p': 'reminder', 'P': 'reminder', 'a': 'dance', 'A': 'dance' };
    if (map[e.key]) setState(map[e.key]);
    else if (e.key === 'h' || e.key === 'H') controls.hidden = !controls.hidden;
    else if (e.key === 'f' || e.key === 'F') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
    else if (e.key === ' ') { e.preventDefault(); blink = 1; }
    else if (e.key === 'z' || e.key === 'Z') winkL = 1;
    else if (e.key === 'k' || e.key === 'K') progressDemo();
    else if (e.key === 's' || e.key === 'S') presentDemo();
    else if (e.key === 'm' || e.key === 'M') {
      voiceOn = !voiceOn; if (!voiceOn && synth) synth.cancel();
      try { localStorage.setItem('enkiVoiceOn', voiceOn ? '1' : '0'); } catch (_) {}
      say(voiceInfo()); talkUntil = 0;
    }
    else if (e.key === 'n' || e.key === 'N') {
      loadVoices(); if (voices.length) voiceIdx = (voiceIdx + 1) % voices.length;
      try { localStorage.setItem('enkiVoiceIdx', String(voiceIdx)); } catch (_) {}
      voiceOn = true; say(voiceInfo()); talkUntil = 0; speak('Merhaba. Bu sesim nasıl?', true);
    }
    else if (e.key === 'Escape' && pres.on) { demoSteps.forEach(clearTimeout); unpresent(); }
    else if (e.key === 'v' || e.key === 'V') {
      workStyle = WORK_STYLES[(WORK_STYLES.indexOf(workStyle) + 1) % WORK_STYLES.length];
      try { localStorage.setItem('enkiWork3', workStyle); } catch (_) {}
      if (state !== 'focus') setState('focus');
      say('Çalışma animasyonu: ' + WORK_NAMES[workStyle]); talkUntil = 0;
    }
    else if (e.key === 'b' || e.key === 'B') boot('idle');
    else if (e.key === 'Enter' && state === 'boot') bootDone(); // Python olmadan elle aç
  });

  // sayfa açılınca açılış animasyonuyla başlar
  if (reduce) setState('idle'); else boot('idle');
})();
</script>
